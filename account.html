<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account — Mahr Fragrances</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<style>.account-box{max-width:420px;margin:0 auto;}
.form-field{margin-bottom:18px;}
.form-field label{display:block;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--grey);margin-bottom:8px;}
.form-field input{width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-size:14px;}
</style>
</head>
<body>
<div id="site-header"></div>
<section style="background:var(--navy); color:#fff; text-align:center; padding:70px 0;">
  <div class="container"><div class="eyebrow eyebrow--light">Welcome Back</div><h1 style="color:#fff;">Sign In</h1></div>
</section>
<section>
  <div class="container account-box">
    <form onsubmit="event.preventDefault(); MAHR.showToast('This is a mock store — accounts are not connected yet');">
      <div class="form-field"><label>Email</label><input type="email" required></div>
      <div class="form-field"><label>Password</label><input type="password" required></div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <p class="text-center small-text" style="margin-top:18px;color:var(--grey);">Don't have an account? <a href="#" style="color:var(--navy);text-decoration:underline;">Create one</a></p>
  </div>
</section>
<div id="site-footer"></div>
<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script>MAHR.initLayout('');</script>
</body>
</html>
