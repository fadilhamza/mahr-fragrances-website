<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order — Mahr Fragrances</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .track-box{max-width:520px;margin:0 auto;text-align:center;}
  .track-form{display:flex;gap:10px;margin-top:24px;}
  .track-form input{flex:1;border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-size:14px;}
</style>
</head>
<body>
<div id="site-header"></div>
<section style="background:var(--navy); color:#fff; text-align:center; padding:70px 0;">
  <div class="container"><div class="eyebrow eyebrow--light">Orders</div><h1 style="color:#fff;">Track Your Order</h1></div>
</section>
<section>
  <div class="container track-box">
    <p style="color:var(--grey);">Enter your order number and email to see the latest status.</p>
    <form class="track-form" onsubmit="event.preventDefault(); MAHR.showToast('This is a mock store — order tracking is not connected yet');">
      <input type="text" placeholder="Order number" required>
      <button class="btn btn-primary" type="submit">Track</button>
    </form>
  </div>
</section>
<div id="site-footer"></div>
<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script>MAHR.initLayout('');</script>
</body>
</html>
